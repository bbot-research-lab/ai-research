# 파일명: .github/workflows/local-strategy-parity.yml
# 실제 업로드 캔들과 원본 로컬 기록 비교. 최종 실거래 동등성 승인 아님.
name: Actual local 12H historical signal parity
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/local-strategy-parity.yml
permissions:
  contents: read
jobs:
  parity:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BBOT_LOCAL_ROOT: C:/my/bbot-parity
      RUNNER_DRY_RUN: '1'
      B_BOT_V3_SERVER_PUSH_HOLD: '1'
      PYTHONUTF8: '1'
      PYTHONWARNINGS: ignore
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-research-ci.txt
    - name: Install original replay dependencies
      run: python -m pip install -r requirements-research-ci.txt
    - name: Retrieve verified private original workspace
      env:
        SOURCE_URL: https://github.com/bbot-research-lab/ai-research/releases/download/research-inputs-20261014/source5.enc
        SOURCE_SHA: d08b786c0ec504e790e895f3d3645eb2957f8e899f3c5fb0534b7c6d1841376b
        STATE_KEY: ${{ secrets.BBOT_RESEARCH_STATE_KEY }}
      shell: python
      run: "import base64, hashlib, io, os, zipfile, urllib.request\nfrom cryptography.hazmat.primitives.ciphers.aead\
        \ import AESGCM\nfrom pathlib import Path, PurePosixPath\nrequest = urllib.request.Request(os.environ[\"\
        SOURCE_URL\"])\ntry:\n    with urllib.request.urlopen(request, timeout=120)\
        \ as response:\n        data = response.read()\nexcept Exception:\n    raise\
        \ SystemExit(\"Private research bundle download failed; URL suppressed\")\n\
        if hashlib.sha256(data).hexdigest() != os.environ[\"SOURCE_SHA\"]:\n    raise\
        \ SystemExit(\"Original bundle hash mismatch\")\ntry:\n    key = base64.b64decode(os.environ[\"\
        STATE_KEY\"], validate=True)\n    data = AESGCM(key).decrypt(data[:12], data[12:],\
        \ b\"BBOT_RESEARCH_SOURCE_V1\")\nexcept Exception:\n    raise SystemExit(\"\
        Original encrypted bundle authentication failed\")\nroot = Path(os.environ[\"\
        BBOT_LOCAL_ROOT\"])\nroot.mkdir(parents=True, exist_ok=True)\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as archive:\n    seen = set()\n    for item in archive.infolist():\n   \
        \     name = item.filename.replace(\"\\\\\", \"/\")\n        path = PurePosixPath(name)\n\
        \        if path.is_absolute() or \"..\" in path.parts or \":\" in name or\
        \ name.casefold() in seen:\n            raise SystemExit(\"Invalid private\
        \ research archive path\")\n        seen.add(name.casefold())\n        if\
        \ item.is_dir():\n            continue\n        target = root.joinpath(*path.parts)\n\
        \        target.parent.mkdir(parents=True, exist_ok=True)\n        target.write_bytes(archive.read(item))\n"
    - name: Load identical uploaded real candles and original reference
      shell: python
      env:
        PARITY_URL: https://github.com/bbot-research-lab/ai-research/releases/download/research-inputs-20261014/parity12h.enc
        PARITY_SHA: 3bf764d3e91f815c712fad76d8270270c1a815df27a6a07116e0e7d4524e9e35
        STATE_KEY: ${{ secrets.BBOT_RESEARCH_STATE_KEY }}
      run: "import os,io,base64,hashlib,zipfile,urllib.request\nfrom pathlib import\
        \ Path,PurePosixPath\nfrom cryptography.hazmat.primitives.ciphers.aead import\
        \ AESGCM\nwith urllib.request.urlopen(os.environ['PARITY_URL'],timeout=120)\
        \ as response:data=response.read()\nif hashlib.sha256(data).hexdigest()!=os.environ['PARITY_SHA']:raise\
        \ SystemExit('PARITY_INPUT_HASH_MISMATCH')\ndata=AESGCM(base64.b64decode(os.environ['STATE_KEY'],validate=True)).decrypt(data[:12],data[12:],b'BBOT_LOCAL_PARITY_12H_V1')\n\
        root=Path(os.environ['BBOT_LOCAL_ROOT'])\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as archive:\n    for item in archive.infolist():\n        path=PurePosixPath(item.filename)\n\
        \        if path.is_absolute() or '..' in path.parts or ':' in item.filename:raise\
        \ SystemExit('PARITY_ARCHIVE_PATH_INVALID')\n        if item.filename!='.local-parity-reference.json'\
        \ and not item.filename.startswith('data/candles/'):raise SystemExit('PARITY_ARCHIVE_SCOPE_INVALID')\n\
        \        target=root.joinpath(*path.parts);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(archive.read(item))\n"
    - name: Compare actual hosted signal replay with original local reference
      shell: python
      run: "import os,sys,json,hashlib\nfrom pathlib import Path\nimport pandas as\
        \ pd\nroot=Path(os.environ['BBOT_LOCAL_ROOT']);sys.path.insert(0,str(root));sys.path.insert(0,str(root/'strategy_lab'))\n\
        status={'scope':'HISTORICAL_12H_SHADOW_SIGNAL_REPLAY','symbols':0,'closed_bars':0,'signal_and_transition_parity':False,'full_trading_parity':'NOT_VERIFIED','final_completion':False}\n\
        try:\n    import v3_shadow_engine as sh\n    ref=json.loads((root/'.local-parity-reference.json').read_text())\n\
        \    if ref['original_saved_events_match'] is not True:raise RuntimeError('ORIGINAL_REFERENCE_NOT_REPRODUCED')\n\
        \    contract=sh._bundle_shadow_contract_for(ref['version_id'],'12H',ref['strategy'])\n\
        \    module,sources=sh._load_bundle_shadow_adapter(ref['version_id'],ref['strategy'],'12H',contract)\n\
        \    if sources!=ref['sources']:raise RuntimeError('SOURCE_VERSION_MISMATCH')\n\
        \    for expected in ref['results']:\n        path=root/'data/candles'/expected['symbol']/'12h.parquet'\n\
        \        if hashlib.sha256(path.read_bytes()).hexdigest()!=expected['input_sha256']:raise\
        \ RuntimeError('INPUT_BYTES_DIFFER')\n        raw=pd.read_parquet(path);raw=raw[raw['is_closed'].fillna(False).astype(bool)].copy()\n\
        \        raw['ts']=pd.to_datetime(raw.open_time,utc=True).astype('int64')//10**9+43200\n\
        \        frame=sh._prepare_frame(raw[raw.ts<=expected['latest_ts']].copy())\n\
        \        if len(frame)!=expected['rows']:raise RuntimeError('CLOSED_INPUT_ROWS_DIFFER')\n\
        \        signals=sh._signal_array(module,frame,'12H');ok,events=sh._dryrun_transition(signals)\n\
        \        if hashlib.sha256(signals.tobytes()).hexdigest()!=expected['signals_sha256']\
        \ or json.loads(json.dumps(events))!=expected['events']:raise RuntimeError('ACTUAL_SIGNAL_OR_TRANSITION_MISMATCH')\n\
        \        status['symbols']+=1;status['closed_bars']+=len(frame)\n    status['signal_and_transition_parity']=True\n\
        except Exception as error:\n    status['error_type']=type(error).__name__\n\
        Path('local-parity-status.json').write_text(json.dumps(status,indent=2))\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:\n\
        \    out.write('Historical 12H real-candle signal replay: '+('MATCH' if status['signal_and_transition_parity']\
        \ else 'FAILED')+'; symbols='+str(status['symbols'])+'; closed bars='+str(status['closed_bars'])+'.\
        \ Full trading results and final completion remain NOT_VERIFIED.\\n')\nprint(json.dumps(status))\n\
        if not status['signal_and_transition_parity']:raise SystemExit('ACTUAL_LOCAL_REFERENCE_PARITY_FAILED')\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: actual-local-12h-parity-status
        path: local-parity-status.json
        if-no-files-found: error
