name: Candidate search tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_addon/**'
      - 'tests/**'
      - '.github/workflows/candidate-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research test requirements
        run: python -m pip install --disable-pip-version-check -r requirements-research-ci.txt
      - run: python -m unittest discover -s tests -v
      - name: Optuna import check
        run: |
          python -c "from research_addon.candidate_search import optuna_candidates, Range; x=optuna_candidates({'p': Range(0,1)}, lambda z: -(z['p']-.5)**2, trials=3); assert len(x)==3"
