# 파일명: .github/workflows/continuous-research.yml
# 데이터 준비: 월별 공백은 검증된 거래소 일별 원본으로만 복구한다.
name: Continuous original strategy research
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-research.yml'
permissions:
  contents: read
concurrency:
  group: original-strategy-research-single-writer
  cancel-in-progress: false
jobs:
  inputs:
    # Continuous original V3 research: scheduled 24/7; input check remains fail-closed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verify hosted research input connection
        id: check
        env:
          SOURCE_URL: ${{ secrets.BBOT_RESEARCH_SOURCE_URL }}
          SOURCE_SHA: ${{ vars.BBOT_RESEARCH_SOURCE_SHA256 }}
          STATE_KEY: ${{ secrets.BBOT_RESEARCH_STATE_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, re
          missing = []
          if not os.environ.get("SOURCE_URL", "").startswith("https://"):
              missing.append("protected original research bundle")
          if not re.fullmatch(r"[a-f0-9]{64}", os.environ.get("SOURCE_SHA", "")):
              missing.append("verified bundle SHA256")
          try:
              if len(base64.b64decode(os.environ.get("STATE_KEY", ""), validate=True)) != 32:
                  raise ValueError()
          except (ValueError, TypeError):
              missing.append("encrypted checkpoint key")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("ready=" + ("false" if missing else "true") + "\n")
          if missing:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write("Research not started. Missing hosted input connection: " + ", ".join(missing) + ".\n")
              raise SystemExit("HOSTED_RESEARCH_INPUTS_NOT_CONNECTED")
          PY
  research:
    needs: inputs
    if: needs.inputs.outputs.ready == 'true'
    # Windows preserves the original controller's msvcrt locking and path semantics.
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      BBOT_LOCAL_ROOT: 'C:\my\bottest'
      B_BOT_V3_SERVER_PUSH_HOLD: '1'
      BBOT_AUTO_RESEARCH_MANAGER_V1: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-research-ci.txt
      - name: Install cached research dependencies
        run: python -m pip install -r requirements-research-ci.txt cryptography
      - name: Retrieve verified private original workspace
        env:
          SOURCE_URL: ${{ secrets.BBOT_RESEARCH_SOURCE_URL }}
          SOURCE_SHA: ${{ vars.BBOT_RESEARCH_SOURCE_SHA256 }}
          STATE_KEY: ${{ secrets.BBOT_RESEARCH_STATE_KEY }}
        shell: python
        run: |
          import base64, hashlib, io, os, zipfile, urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from pathlib import Path, PurePosixPath
          request = urllib.request.Request(os.environ["SOURCE_URL"])
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
          except Exception:
              raise SystemExit("Private research bundle download failed; URL suppressed")
          if hashlib.sha256(data).hexdigest() != os.environ["SOURCE_SHA"]:
              raise SystemExit("Original bundle hash mismatch")
          try:
              key = base64.b64decode(os.environ["STATE_KEY"], validate=True)
              data = AESGCM(key).decrypt(data[:12], data[12:], b"BBOT_RESEARCH_SOURCE_V1")
          except Exception:
              raise SystemExit("Original encrypted bundle authentication failed")
          root = Path(os.environ["BBOT_LOCAL_ROOT"])
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              seen = set()
              for item in archive.infolist():
                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or ":" in name or name.casefold() in seen:
                      raise SystemExit("Invalid private research archive path")
                  seen.add(name.casefold())
                  if item.is_dir():
                      continue
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
      - name: Restore encrypted persistent research branch
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.BBOT_RESEARCH_STATE_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code --heads origin research-state > $null
          $stateExists = $LASTEXITCODE -eq 0
          if (!$stateExists -and $LASTEXITCODE -ne 2) { throw 'State lookup failed; refusing baseline reset' }
          if ($stateExists) {
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin research-state
            if ($LASTEXITCODE -ne 0) { throw 'State fetch failed' }
            git worktree add --detach "$env:RUNNER_TEMP/research-state" FETCH_HEAD
          } else {
            git worktree add --detach "$env:RUNNER_TEMP/research-state" HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Initial state worktree failed' }
            git -C "$env:RUNNER_TEMP/research-state" switch --orphan hosted-research-state
          }
          if ($LASTEXITCODE -ne 0) { throw 'State checkout failed' }
          $env:BBOT_INITIAL_SEED = if ($stateExists) { '0' } else { '1' }
          @'
          import base64, io, os, zipfile, gzip, re
          from pathlib import Path, PurePosixPath
          import json, hashlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root = Path(os.environ["BBOT_LOCAL_ROOT"])
          state = Path(os.environ["RUNNER_TEMP"]) / "research-state"
          if os.environ.get("BBOT_INITIAL_SEED") == "1":
              seed = json.loads((root / ".hosted_seed.json").read_text())
              ledger_file = root / "strategy_lab/results/v3/trial_ledger.json"
              ledger = json.loads(ledger_file.read_text(encoding="utf-8-sig"))
              if seed.get("schema") != "BBOT_UPLOADED_RESEARCH_SEED_V1" or seed.get("trial_ledger_sha256") != hashlib.sha256(ledger_file.read_bytes()).hexdigest() or seed.get("trial_count", 0) != len(ledger.get("entries", [])) or not ledger.get("entries"):
                  raise SystemExit("Uploaded original research state invalid; refusing empty-state research")
          else:
              manifest = json.loads((state / "checkpoint.json").read_text())
              key = base64.b64decode(os.environ["STATE_KEY"], validate=True)
              if manifest.get("schema") == "BBOT_ENCRYPTED_CHECKPOINT_V3":
                  data = (state / "checkpoint.index.enc").read_bytes()
                  if hashlib.sha256(data).hexdigest() != manifest.get("sha256"):
                      raise SystemExit("Encrypted checkpoint index hash mismatch")
                  index = json.loads(AESGCM(key).decrypt(data[:12], data[12:], b"BBOT_RESEARCH_INDEX_V3"))
                  if index.get("schema") != "BBOT_PRIVATE_FILE_INDEX_V3" or not isinstance(index.get("files"), dict) or not index["files"]:
                      raise SystemExit("Encrypted checkpoint index invalid")
                  seen, total = set(), 0
                  for name, record in index["files"].items():
                      path = PurePosixPath(name)
                      if path.is_absolute() or ".." in path.parts or ":" in name or "\\" in name or not name.startswith("strategy_lab/results/") or name.casefold() in seen:
                          raise SystemExit("Invalid incremental checkpoint path")
                      seen.add(name.casefold())
                      if type(record.get("size")) is not int or not 0 <= record["size"] <= 3 * 1024**3 or not re.fullmatch(r"[a-f0-9]{64}", record.get("sha256", "")):
                          raise SystemExit("Invalid incremental file identity")
                      total += record["size"]
                      if total > 3 * 1024**3 or not isinstance(record.get("objects"), list) or not 1 <= len(record["objects"]) <= 100:
                          raise SystemExit("Incremental checkpoint capacity invalid")
                      chunks = []
                      for object_id in record["objects"]:
                          if not isinstance(object_id, str) or not re.fullmatch(r"[a-f0-9]{64}", object_id):
                              raise SystemExit("Invalid encrypted object identity")
                          chunk = (state / "objects" / (object_id + ".enc")).read_bytes()
                          if len(chunk) > 30 * 1024**2 or hashlib.sha256(chunk).hexdigest() != object_id:
                              raise SystemExit("Encrypted file object hash mismatch")
                          chunks.append(chunk)
                      cipher = b"".join(chunks)
                      packed = AESGCM(key).decrypt(cipher[:12], cipher[12:], b"BBOT_RESEARCH_FILE_V3")
                      with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
                          plain = stream.read(record["size"] + 1)
                      if len(plain) != record["size"] or hashlib.sha256(plain).hexdigest() != record["sha256"]:
                          raise SystemExit("Incremental checkpoint plaintext identity mismatch")
                      target = root.joinpath(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(plain)
                  (root / ".hosted_objects.json").write_text(json.dumps(index), encoding="utf-8")
              elif manifest.get("schema") == "BBOT_ENCRYPTED_CHECKPOINT_V2" and type(manifest.get("parts")) is int and 1 <= manifest["parts"] <= 100:
                  data = b"".join((state / f"checkpoint.{i:03d}.enc").read_bytes() for i in range(manifest["parts"]))
                  if hashlib.sha256(data).hexdigest() != manifest.get("sha256"):
                      raise SystemExit("Encrypted checkpoint hash mismatch")
                  plain = AESGCM(key).decrypt(data[:12], data[12:], b"BBOT_RESEARCH_STATE_V1")
                  with zipfile.ZipFile(io.BytesIO(plain)) as archive:
                      for item in archive.infolist():
                          path = PurePosixPath(item.filename)
                          if path.is_absolute() or ".." in path.parts or ":" in item.filename or not item.filename.startswith("strategy_lab/results/"):
                              raise SystemExit("Invalid checkpoint path")
                          if not item.is_dir():
                              target = root.joinpath(*path.parts)
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(archive.read(item))
              else:
                  raise SystemExit("Encrypted checkpoint manifest invalid")
          metadata = root / "strategy_lab/results/.hosted_mtimes.json"
          if not metadata.is_file():
              raise SystemExit("Initial original timestamp manifest missing; refusing duplicate-input reruns")
          for name, record in json.loads(metadata.read_text()).items():
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or ":" in name:
                  raise SystemExit("Invalid timestamp manifest path")
              target = root.joinpath(*path.parts)
              if target.is_file() and target.stat().st_size == record["size"] and hashlib.sha256(target.read_bytes()).hexdigest() == record["sha256"]:
                  os.utime(target, ns=(record["mtime_ns"], record["mtime_ns"]))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint validation failed; refusing empty-state research' }
          "BBOT_STATE_RESTORED=1" >> $env:GITHUB_ENV
      - name: Validate original governance and plan required public candles
        id: plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(BINANCE_|AWS_|TELEGRAM_|GH_TOKEN$|GITHUB_TOKEN$|API_KEY$|API_SECRET$)' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          Set-Location $env:BBOT_LOCAL_ROOT
          @'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ["BBOT_LOCAL_ROOT"])
          sys.path.insert(0, str(root / "strategy_lab"))
          config = json.loads((root / "strategy_lab/lab_config.json").read_text(encoding="utf-8-sig"))
          if config.get("auto_deploy") is not False or config.get("mode") != "EXACT_SIGNAL_CACHE":
              raise SystemExit("Original no-deployment research config required")
          import v3_governance as governance
          if not governance.validate_constitution().get("ok"):
              raise SystemExit("Original constitution invalid")
          import research_controller as controller
          if not controller.managed_dry_run().get("ok"):
              raise SystemExit("Original managed research preflight failed")
          ledger = json.loads((root / "strategy_lab/results/v3/trial_ledger.json").read_text(encoding="utf-8-sig"))
          (root / ".hosted_before.json").write_text(json.dumps({"counter":int(ledger.get("counter", 0))}))
          import pandas as pd, hashlib
          from datetime import datetime, timezone, timedelta
          study = controller.strategy_research
          work = study.pipeline_work_status()
          selection = controller.task_queue.preview_auto_research_bucket(controller._managed_availability(work), bool(work.get("historical_backlog_mode")))
          bucket = selection.get("bucket") if selection else ""
          candidates = []
          if bucket in {"TRAILING_AND_REENTRY", "INDIVIDUAL_TRAILING"}:
              phase = "INDIVIDUAL_TRAILING_OPTIMIZATION_PENDING" if work.get("trailing_pending") else "REENTRY_RESEARCH_PENDING"
              candidates = [x for x in study.load(study.HISTORICAL_STAGE2, {}).get("entries", []) if x.get("eligible") is True and x.get("pipeline_stage") == phase]
          elif bucket in {"HISTORICAL_314_PIPELINE", "ENTRY_AND_FINAL_RISK", "FULL_VALIDATION", "FULL_VALIDATION_AND_BLIND", "SEALED_FINAL_BLIND", "TARGETED_REDEVELOPMENT"}:
              # Preparing every eligible pending timeframe preserves original scheduler choices.
              candidates = [x for x in study.load(study.HISTORICAL_STAGE2, {}).get("entries", []) if x.get("eligible") is True and any(mark in str(x.get("pipeline_stage", "")) for mark in ("PENDING", "INCOMPLETE"))]
          elif bucket == "NEW_PURE_AND_HARD_PASS":
              nxt = study.choose_next()
              if nxt:
                  tf, source = nxt
                  candidates = [{"timeframe":tf, "canonical_source_file":str(source)}]
              else:
                  grammar = controller.hypothesis_factory.choose_next()
                  if grammar:
                      tf, hypothesis = grammar
                      candidates = [{"timeframe":tf}]
                  else:
                      tf = controller.combination_research.choose_next_tf()
                      if tf:
                          candidates = [{"timeframe":tf}]
          if bucket in {"TRAILING_AND_REENTRY", "INDIVIDUAL_TRAILING"}:
              candidates = candidates[:1]  # Original trailing/reentry action consumes the first pending target.
          if not candidates:
              raise SystemExit("No verified original research input requirement; no trial reserved")
          timeframes = sorted({str(x["timeframe"]).lower().replace("1m", "1M") for x in candidates})
          # Every slot requires authenticated original bars before its trial is reserved.
          supported = {"30m", "1h", "6h", "12h", "1d", "1w", "1M"}
          if any(tf not in supported for tf in timeframes):
              raise SystemExit("Required original candle interval not supported by verified downloader")
          cache_path = Path(config["data_file"])
          cache = pd.read_parquet(cache_path, columns=["symbol", "ts"])
          symbols = sorted(cache.symbol.unique().tolist())
          last_timestamp = int(cache.ts.max())
          if bucket in {"TRAILING_AND_REENTRY", "INDIVIDUAL_TRAILING", "NEW_PURE_AND_HARD_PASS", "HISTORICAL_314_PIPELINE", "ENTRY_AND_FINAL_RISK"}:
              # Ask the original runner for its exact fixed-window dataset; never backfill with today's selection.
              import run_strategy as official
              a, b = study.hard_pass_dates()
              os.environ.update(BBOT_RESEARCH_DATASET_MODE="HARD_PASS_ONLY", BBOT_RESEARCH_START=a, BBOT_RESEARCH_END=b)
              window = official.hard_pass_window_from_env()
              datasets = official.make_hard_pass_dataset_windows(cache, window["start_ts"], window["end_ts"])
              selected = datasets[official.HARD_PASS_DATASET]
              symbols = selected["symbols"]
              last_timestamp = max(row["end"] for row in selected["windows"].values())
          start = datetime.fromtimestamp(int(cache.ts.min()), timezone.utc).replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          end = datetime.fromtimestamp(last_timestamp, timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(days=1)
          plan = {"symbols":symbols, "timeframes":timeframes, "start":start.isoformat(), "end":end.isoformat()}
          (root / ".hosted_candle_plan.json").write_text(json.dumps(plan))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("cache_key=bbot-candles-" + hashlib.sha256(cache_path.read_bytes()).hexdigest()[:16] + "-" + "-".join(timeframes) + "-" + end.strftime("%Y%m%d") + "\n")
          print("Original governance PASS; public candle prerequisites planned; no research approval implied.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Original input preflight failed; no trial reserved' }
      - uses: actions/cache/restore@v4
        id: candles
        with:
          path: 'C:/my/bottest/data/candles'
          key: ${{ steps.plan.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.plan.outputs.cache_key }}-
      - name: Recover and validate authentic public candles before reserving a trial
        shell: python
        run: |
          import json, os, sys
          from datetime import datetime
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ["GITHUB_WORKSPACE"]) / "scripts"))
          from download_historical_candles import prewarm_official_history
          root = Path(os.environ["BBOT_LOCAL_ROOT"])
          plan = json.loads((root / ".hosted_candle_plan.json").read_text())
          rows = prewarm_official_history(plan["symbols"], root, datetime.fromisoformat(plan["start"]), datetime.fromisoformat(plan["end"]), plan["timeframes"])
          if any(row["state"] == "FAILED" for row in rows):
              raise SystemExit("Authentic candle coverage incomplete; no trial reserved or rejected")
      - uses: actions/cache/save@v4
        if: always() && steps.plan.outcome == 'success'
        with:
          path: 'C:/my/bottest/data/candles'
          key: ${{ steps.plan.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run unchanged original bounded roadmap research action
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(BINANCE_|AWS_|TELEGRAM_|GH_TOKEN$|GITHUB_TOKEN$|API_KEY$|API_SECRET$)' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          Set-Location $env:BBOT_LOCAL_ROOT
          "BBOT_RESEARCH_STARTED=1" >> $env:GITHUB_ENV
          # One original controller invocation performs one bounded V3 task.
          # Re-invoke it to let the ORIGINAL scheduler advance qualified
          # candidates through its own gates; never hand-select stage names.
          # Continue original scheduled research; the original V3 engine owns all
          # stage transitions and official grading. This is not a PASS loop.
          $cycles = 24
          $ledgerPath = Join-Path $env:BBOT_LOCAL_ROOT 'strategy_lab/results/v3/trial_ledger.json'
          $initialCount = if (Test-Path $ledgerPath) { @((Get-Content -Raw -Encoding UTF8 $ledgerPath | ConvertFrom-Json).entries).Count } else { 0 }
          for ($cycle = 1; $cycle -le $cycles; $cycle++) {
            Write-Output "ORIGINAL_V3_CYCLE_START=$cycle/$cycles"
            python strategy_lab/roadmap_manager.py *> $null
            if ($LASTEXITCODE -ne 0) { throw "Original controller failed at cycle $cycle; no research PASS claimed" }
            $statusPath = Join-Path $env:BBOT_LOCAL_ROOT 'strategy_lab/results/roadmap_status_latest.json'
            if (-not (Test-Path $statusPath)) { throw "Missing original controller result at cycle $cycle" }
            $status = Get-Content -Raw -Encoding UTF8 $statusPath | ConvertFrom-Json
            if ($status.ok -ne $true) { throw "Original controller reported failure at cycle $cycle" }
            $controller = $status.controller_result
            if ($null -eq $controller) { throw "Missing original controller response at cycle $cycle" }
            if ($controller.returncode -ne 0) { throw "Original controller nonzero returncode at cycle $cycle" }
            $action = [string]$controller.action
            $inner = $controller.result
            $innerStatus = if ($null -ne $inner) { [string]$inner.status } else { '' }
            $innerAction = if ($null -ne $inner) { [string]$inner.action } else { '' }
            $trialCount = if (Test-Path $ledgerPath) { @((Get-Content -Raw -Encoding UTF8 $ledgerPath | ConvertFrom-Json).entries).Count } else { 0 }
            Write-Output "ORIGINAL_V3_CYCLE_FINISHED=$cycle; ACTION=$action; STAGE_STATUS=$innerStatus; STAGE_ACTION=$innerAction; TRIAL_RECORDS=$trialCount"
            if ($trialCount -lt $initialCount) { throw "Original trial ledger shrank; stop before any further research" }
            $initialCount = $trialCount
            if ($action -in @('GOVERNANCE_BLOCK','SKIP') -or $innerAction -eq 'GOVERNANCE_BLOCK') { throw "Original V3 governance or lock block: $action / $innerAction" }
            if ($action -eq 'AUTO_RESEARCH_MANAGER_STAGE10' -and $null -eq $inner) { throw "Original V3 stage result missing; refuse false success" }
            if ($action -eq 'NO_NEW_BOUNDED_INPUT' -or $innerAction -eq 'NO_NEW_BOUNDED_INPUT' -or $innerStatus -in @('NO_NEW_RESEARCH_BACKLOG','NO_WORK_FOR_SELECTED_BUCKET')) {
              Write-Output 'ORIGINAL_V3_NO_MORE_BOUNDED_WORK'
              break
            }
          }
      - name: Report actual original research outcome
        if: always() && env.BBOT_RESEARCH_STARTED == '1'
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ["BBOT_LOCAL_ROOT"])
          report = json.loads((root / "strategy_lab/results/roadmap_status_latest.json").read_text(encoding="utf-8-sig"))
          ledger = json.loads((root / "strategy_lab/results/v3/trial_ledger.json").read_text(encoding="utf-8-sig"))
          before = json.loads((root / ".hosted_before.json").read_text())
          rows = [row for row in ledger.get("entries", []) if int(row.get("v3_trial", 0)) > before["counter"]]
          completed = sum(row.get("event") == "COMPLETED" for row in rows)
          failed = sum(row.get("event") == "COMPLETED" and row.get("status") == "FAIL" for row in rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Original research action: {len(rows)} new trial records, {completed} completed, {failed} failed. Original pass criteria unchanged; engine exit success is not strategy approval. All outcomes enter the encrypted checkpoint.\n")
          controller = report.get("controller_result", {})
          outcome = json.dumps(controller.get("result", {})).upper()
          if report.get("ok") is not True or controller.get("returncode", 0) != 0 or any(marker in outcome for marker in ("RUNTIME_FAIL", "RUN_STRATEGY_FAIL", "RESULT_NOT_FOUND", "SOURCE_MISSING")):
              raise SystemExit("Original research infrastructure failure; failed state retained; no strategy PASS claimed")
      - name: Audit original research pipeline functions and persistence (read-only)
        if: always() && env.BBOT_RESEARCH_STARTED == '1'
        shell: python
        run: |
          import os, runpy
          runpy.run_path(os.path.join(os.environ["GITHUB_WORKSPACE"],"scripts","audit_original_research_pipeline.py"),run_name="__main__")
      - name: Report blind validation and SHADOW evidence (read-only)
        if: always() && env.BBOT_RESEARCH_STARTED == '1'
        shell: python
        run: |
          import os, runpy
          runpy.run_path(os.path.join(os.environ["GITHUB_WORKSPACE"],"scripts","report_v3_blind_shadow.py"),run_name="__main__")
      - name: Save encrypted original checkpoint for next hosted run
        if: always() && env.BBOT_RESEARCH_STARTED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.BBOT_RESEARCH_STATE_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, io, os, gzip, json, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root = Path(os.environ["BBOT_LOCAL_ROOT"])
          tracked = ["strategy_config.json", "strategy_lab/results/v3/research_knowledge.json", "strategy_lab/results/v3/trial_ledger.json", "strategy_lab/results/v3/deployment_state.json", "strategy_lab/results/candidate_registry.json", "data/server_runtime/history.db", "state/position_cache.json", "state/major_symbols.json", "state/v3_blocked_additional_candidates.json"]
          metadata = {}
          # Original task signatures include nanosecond mtime: preserve it only for identical bytes.
          for name in tracked:
              path = root / name
              if path.is_file():
                  stat = path.stat()
                  metadata[name] = {"size": stat.st_size, "mtime_ns": stat.st_mtime_ns, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          meta = root / "strategy_lab/results/.hosted_mtimes.json"
          meta.write_text(json.dumps(metadata, sort_keys=True), encoding="utf-8")
          key = base64.b64decode(os.environ["STATE_KEY"], validate=True)
          state = Path(os.environ["RUNNER_TEMP"]) / "research-state"
          objects = state / "objects"
          objects.mkdir(parents=True, exist_ok=True)
          previous = root / ".hosted_objects.json"
          prior = json.loads(previous.read_text()) if previous.is_file() else {"files": {}}
          identities = {record["sha256"]: record for record in prior["files"].values()}
          index = {"schema": "BBOT_PRIVATE_FILE_INDEX_V3", "files": {}}
          chunk_size = 30 * 1024 * 1024
          added, reused, total = 0, 0, 0
          for path in sorted((root / "strategy_lab/results").rglob("*")):
              if not path.is_file():
                  continue
              plain = path.read_bytes()
              digest = hashlib.sha256(plain).hexdigest()
              total += len(plain)
              if total > 3 * 1024**3:
                  raise SystemExit("Checkpoint capacity exceeded; no partial state commit")
              record = identities.get(digest)
              if record and record["size"] == len(plain):
                  for object_id in record["objects"]:
                      stored = objects / (object_id + ".enc")
                      if not stored.is_file() or hashlib.sha256(stored.read_bytes()).hexdigest() != object_id:
                          raise SystemExit("Existing encrypted object damaged; refusing state overwrite")
                  reused += 1
              else:
                  nonce = os.urandom(12)
                  cipher = nonce + AESGCM(key).encrypt(nonce, gzip.compress(plain, mtime=0), b"BBOT_RESEARCH_FILE_V3")
                  ids = []
                  for offset in range(0, len(cipher), chunk_size):
                      chunk = cipher[offset:offset + chunk_size]
                      object_id = hashlib.sha256(chunk).hexdigest()
                      (objects / (object_id + ".enc")).write_bytes(chunk)
                      ids.append(object_id)
                  record = {"size": len(plain), "sha256": digest, "objects": ids}
                  identities[digest] = record
                  added += 1
              index["files"][path.relative_to(root).as_posix()] = record
          if not index["files"]:
              raise SystemExit("Empty checkpoint forbidden")
          nonce = os.urandom(12)
          packed = json.dumps(index, sort_keys=True).encode("utf-8")
          encrypted = nonce + AESGCM(key).encrypt(nonce, packed, b"BBOT_RESEARCH_INDEX_V3")
          (state / "checkpoint.index.enc").write_bytes(encrypted)
          (state / "checkpoint.json").write_text(json.dumps({"schema":"BBOT_ENCRYPTED_CHECKPOINT_V3", "sha256":hashlib.sha256(encrypted).hexdigest()},sort_keys=True))
          # Immutable old objects and V2 checkpoints remain recoverable; no history deletion.
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Encrypted checkpoint prepared: {added} new content files, {reused} reused files. Pass and failed research results are both retained. Remote push must still succeed.\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted checkpoint save failed' }
          Set-Location "$env:RUNNER_TEMP/research-state"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- checkpoint.* objects
          git commit -m 'research: persist encrypted original checkpoint'
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint commit failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/research-state
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint persistence failed' }

