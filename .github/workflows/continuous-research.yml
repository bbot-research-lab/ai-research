# 파일명: .github/workflows/continuous-research.yml
name: Continuous original strategy research
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: original-strategy-research-single-writer
  cancel-in-progress: false
jobs:
  research:
    # Enable only after an isolated persistent runner passes the original gates.
    if: vars.BBOT_RESEARCH_ENABLED == 'true'
    runs-on: [self-hosted, bbot-research]
    timeout-minutes: 350
    env:
      BBOT_LOCAL_ROOT: ${{ vars.BBOT_RESEARCH_ROOT }}
      B_BOT_V3_SERVER_PUSH_HOLD: '1'
      BBOT_AUTO_RESEARCH_MANAGER_V1: '1'
      PYTHONUTF8: '1'
    steps:
      # No checkout/clean: original private source, candles and checkpoints persist.
      # This public workflow never uploads private results or original source.
      - name: Verify private original workspace and unchanged governance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BBOT_LOCAL_ROOT)) { throw 'BBOT_RESEARCH_ROOT is required' }
          $root = [IO.Path]::GetFullPath($env:BBOT_LOCAL_ROOT)
          if ($root -match '[/\\]bot[/\\]?$' -or $root -eq '/home/ec2-user/bot') { throw 'Production workspace is forbidden' }
          $python = Join-Path $root '.venv/Scripts/python.exe'
          if (!(Test-Path $python)) { $python = Join-Path $root '.venv/bin/python' }
          if (!(Test-Path $python)) { throw 'Persistent research virtualenv is required' }
          foreach ($relative in @('strategy_lab/research_controller.py','strategy_lab/run_strategy.py','gate_lab_fast.py','ROADMAP_CONSTITUTION_V3.json','strategy_lab/lab_config.json')) {
            if (!(Test-Path (Join-Path $root $relative))) { throw "Missing original input: $relative" }
          }
          $config = Get-Content (Join-Path $root 'strategy_lab/lab_config.json') -Raw | ConvertFrom-Json
          if ($config.auto_deploy -ne $false -or $config.mode -ne 'EXACT_SIGNAL_CACHE') { throw 'Original non-deploying exact-cache config required' }
          # Hide runner credentials from original Python and its subprocesses.
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(BINANCE_|AWS_|TELEGRAM_|GH_TOKEN$|GITHUB_TOKEN$|API_KEY$|API_SECRET$)' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          Set-Location $root
          @'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ["BBOT_LOCAL_ROOT"]).resolve()
          sys.path.insert(0, str(root / "strategy_lab"))
          import pyarrow, pandas, numpy
          import v3_governance as governance
          result = governance.validate_constitution()
          if not result.get("ok"):
              raise SystemExit("Original constitution validation failed")
          config = json.loads((root / "strategy_lab/lab_config.json").read_text(encoding="utf-8-sig"))
          cache = Path(config["data_file"])
          if not cache.is_absolute():
              cache = root / cache
          if not cache.is_file():
              raise SystemExit("Original exact signal cache missing")
          import research_controller as controller
          result = controller.managed_dry_run()
          if not result.get("ok"):
              raise SystemExit("Original managed research preflight failed")
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'Original research preflight failed' }
      - name: Run original persistent research controller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath($env:BBOT_LOCAL_ROOT)
          $python = Join-Path $root '.venv/Scripts/python.exe'
          if (!(Test-Path $python)) { $python = Join-Path $root '.venv/bin/python' }
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(BINANCE_|AWS_|TELEGRAM_|GH_TOKEN$|GITHUB_TOKEN$|API_KEY$|API_SECRET$)' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          Set-Location $root
          & $python (Join-Path $root 'strategy_lab/research_controller.py') --mode loop --enable-research --skip-server-health --sleep-sec 60 --max-cycles 240 *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Original controller failed; inspect private persistent research state' }
