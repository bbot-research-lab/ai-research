name: Read-only verify persisted 6h hop-one
on:
  push:
    branches: [feature/research-multiframe-foundation-20261014]
    paths: ['.github/workflows/verify-6h-hop1.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BBOT_RESEARCH_STATE_KEY: ${{ secrets.BBOT_RESEARCH_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography
      - name: Independently verify encrypted remote hop and historical records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BBOT_RESEARCH_STATE_KEY"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          python - <<'PY'
          import json,os
          from research_addon.remote_state_checker import check_remote_state
          r=check_remote_state("6h","https://github.com/bbot-research-lab/ai-research.git",os.environ["BBOT_RESEARCH_STATE_KEY"])
          print(json.dumps(r,sort_keys=True))
          assert r["verified"] and r["hop"]==1 and r["records"]>=31, "remote hop/data retention mismatch"
          PY
