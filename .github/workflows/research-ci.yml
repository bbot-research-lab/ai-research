name: Research CI (synthetic data only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_addon/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/research-ci.yml'
permissions:
  contents: read
concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public test dependencies
        run: python -m pip install --disable-pip-version-check 'pyarrow>=17,<22' 'optuna>=4,<5'
      - name: Run all research-only unit tests
        run: python -m unittest discover -s tests -v
      - name: Security filename preflight
        run: python scripts/preflight.py
      - name: Declare restrictions
        run: |
          echo "No real B-BOT strategy or cache was executed."
          echo "Sealed/OOS approval, AWS sync and R4 live deployment stay OFF."
