name: Research CI (synthetic data only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_addon/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/research-ci.yml'
permissions:
  contents: read
concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-research-ci.txt
      - name: Verify Parquet engine available
        run: |
          python -c 'import pyarrow,pandas,numpy,optuna; print("pyarrow",pyarrow.__version__,"pandas",pandas.__version__,"numpy",numpy.__version__,"optuna",optuna.__version__)'
          python -c 'import pandas as pd, tempfile, os; f=tempfile.mktemp(suffix=".parquet"); pd.DataFrame({"open_time":[1,2],"close":[3.,4.]}).to_parquet(f); assert len(pd.read_parquet(f)) == 2; os.unlink(f); print("PARQUET_ROUNDTRIP_PASS")'
      - name: Run all research-only unit tests
        run: python -m unittest discover -s tests -v
      - name: Security filename preflight
        run: python scripts/preflight.py
      - name: Declare restrictions
        run: |
          echo "No real B-BOT strategy or cache was executed."
          echo "Sealed/OOS approval, AWS sync and R4 live deployment stay OFF."
